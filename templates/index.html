<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Health Screening Assistant</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<div class="container py-5">

    <div class="text-center mb-5">
        <h1 class="display-5 fw-bold text-primary">
            🩺 AI Smart Health Screening Assistant
        </h1>

        <p class="text-muted">
            Early Cardiovascular Risk Screening using Artificial Intelligence
        </p>
    </div>

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">
                <i class="bi bi-heart-pulse-fill"></i>
                Patient Health Information
            </h4>
        </div>

        <div class="card-body">

            <form action="/predict" method="POST">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Gender</label>

                        <select class="form-select" name="sex">

                            <option value="1">Male</option>
                            <option value="0">Female</option>

                        </select>
                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Chest Pain Type</label>

                        <select class="form-select" name="cp">

                            <option value="0">Typical Angina</option>
                            <option value="1">Atypical Angina</option>
                            <option value="2">Non-anginal Pain</option>
                            <option value="3">Asymptomatic</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Resting Blood Pressure</label>
                        <input type="number" class="form-control" name="trestbps" required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Cholesterol</label>
                        <input type="number" class="form-control" name="chol" required>
                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Fasting Blood Sugar</label>

                        <select class="form-select" name="fbs">

                            <option value="0">Below 120 mg/dl</option>
                            <option value="1">Above 120 mg/dl</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Rest ECG</label>

                        <select class="form-select" name="restecg">

                            <option value="0">Normal</option>
                            <option value="1">ST-T Wave Abnormality</option>
                            <option value="2">Left Ventricular Hypertrophy</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Maximum Heart Rate</label>
                        <input type="number" class="form-control" name="thalach" required>
                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Exercise Induced Angina</label>

                        <select class="form-select" name="exang">

                            <option value="0">No</option>
                            <option value="1">Yes</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Old Peak</label>
                        <input type="number" step="0.1" class="form-control" name="oldpeak" required>
                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Slope</label>

                        <select class="form-select" name="slope">

                            <option value="0">Upsloping</option>
                            <option value="1">Flat</option>
                            <option value="2">Downsloping</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Major Vessels (CA)</label>

                        <select class="form-select" name="ca">

                            <option value="0">0</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">Thalassemia</label>

                        <select class="form-select" name="thal">

                            <option value="0">Normal</option>
                            <option value="1">Fixed Defect</option>
                            <option value="2">Reversible Defect</option>
                            <option value="3">Unknown</option>

                        </select>

                    </div>

                </div>

                <div class="text-center mt-4">

                    <button class="btn btn-primary btn-lg px-5">

                        <i class="bi bi-cpu-fill"></i>

                        Analyze Health

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
